# Example secrets for the satellite firmware. Every value here is a placeholder.
#
# Usage:
#   1. Copy this file to firmware/satellite/secrets.yaml (gitignored).
#   2. Replace every value with the real one.
#   3. Never commit secrets.yaml, and never paste its contents into docs, PRs or logs.
#
# For compile-only checks without real secrets, copy this file to a temp location
# as secrets.yaml instead (see CLAUDE.md, Testing).
#
# Later milestones add their own keys here (for example the MQTT broker address
# and credentials) when they first need them.

# Wi-Fi network the satellite joins.
wifi_ssid: "example-ssid"
wifi_password: "example-wifi-password"

# Password for the fallback hotspot the satellite opens when it cannot join Wi-Fi.
# Must be at least 8 characters.
fallback_ap_password: "example-fallback-password"

# Home Assistant native API encryption key: 32 random bytes, base64-encoded.
# Generate a real one with:
#   python -c "import secrets, base64; print(base64.b64encode(secrets.token_bytes(32)).decode())"
# The value below is 32 zero bytes: valid for compiling, useless as a key.
api_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

# Password required for over-the-air (OTA) firmware updates.
ota_password: "example-ota-password"
