# TEMPORARY diagnostics for M2. Remove this file and its line in sat-hub.yaml
# before the milestone is merged.
#
# These buttons appear in Home Assistant on the Satellite Hub device page. They
# put the DAC's three signal pins (BCK 39, WS 40, DOUT 38) into different states
# so the cause of the idle hum can be found by listening, without reflashing.
#
# None of them touches volume, so the speaker level cap is unaffected. The next
# spoken reply sets the audio output up again from scratch, whatever state the
# buttons left it in.

button:
  - platform: template
    name: "Diag 1 - stop audio output"
    entity_category: diagnostic
    on_press:
      - logger.log: "DIAG 1: stopping I2S output (channel deleted)"
      - lambda: id(i2s_spk).stop();

  - platform: template
    name: "Diag 2 - release audio pins"
    entity_category: diagnostic
    on_press:
      - logger.log: "DIAG 2: stopping I2S output, pins 38/39/40 released (floating)"
      - lambda: id(i2s_spk).stop();
      - delay: 500ms
      - lambda: |-
          gpio_config_t c = {};
          c.pin_bit_mask = (1ULL << 38) | (1ULL << 39) | (1ULL << 40);
          c.mode = GPIO_MODE_DISABLE;
          c.pull_up_en = GPIO_PULLUP_DISABLE;
          c.pull_down_en = GPIO_PULLDOWN_DISABLE;
          gpio_config(&c);

  - platform: template
    name: "Diag 3 - hold audio pins low"
    entity_category: diagnostic
    on_press:
      - logger.log: "DIAG 3: stopping I2S output, pins 38/39/40 driven low"
      - lambda: id(i2s_spk).stop();
      - delay: 500ms
      - lambda: |-
          gpio_config_t c = {};
          c.pin_bit_mask = (1ULL << 38) | (1ULL << 39) | (1ULL << 40);
          c.mode = GPIO_MODE_OUTPUT;
          c.pull_up_en = GPIO_PULLUP_DISABLE;
          c.pull_down_en = GPIO_PULLDOWN_DISABLE;
          gpio_config(&c);
          gpio_set_level(GPIO_NUM_38, 0);
          gpio_set_level(GPIO_NUM_39, 0);
          gpio_set_level(GPIO_NUM_40, 0);

  - platform: template
    name: "Diag 4 - run audio output (silence)"
    entity_category: diagnostic
    on_press:
      - logger.log: "DIAG 4: starting I2S output, sending silence"
      - lambda: id(i2s_spk).start();
