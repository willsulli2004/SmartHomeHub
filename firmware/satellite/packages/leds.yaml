# LEDs: status colours on the WS2812B strip (DATA on GPIO41).
#
# M2 only shows a solid colour per state. M3 adds the full set of LED states and
# animations and the encoder's pixel.
#
#   off         idle, waiting for the wake word
#   blue        wake word heard, listening
#   green       thinking / speaking
#   dim red     muted
#
# The strip must always be driven by the firmware. Left undriven, its data line
# floats and picks up noise from the audio output, which lights it at random.
#
# Current limit (hardware constraint): the strip is the only load on its buck
# converter (MPM3610), which can supply about 1.2 A. Each WS2812B pixel holds a
# red, a green and a blue LED of about 20 mA each at full drive, so 71 pixels
# could ask for 1.4 A in one colour and 4.3 A in white.
#
# power_estimation below is ESPHome's per-frame limiter. Before each frame goes
# out it adds up the estimated draw (20 mA per colour per pixel, plus 1 mA idle
# per pixel) and, if the total is over led_max_current_ma, scales the whole frame
# down to fit. It applies to every colour, effect and write path, so no colour
# can exceed the budget, including white.

substitutions:
  led_count: "71"
  led_max_current_ma: "1000"

light:
  - platform: esp32_rmt_led_strip
    id: status_light
    # TEMPORARY (M2 debugging): shown in Home Assistant for testing by hand.
    name: Status Strip
    pin: GPIO41
    num_leds: ${led_count}
    # Bit timings copied from the Adafruit NeoPixel library, which drove this strip
    # correctly in the Arduino all-components test. ESPHome's built-in WS2812
    # timings (400/1000/1000/400 ns, no reset) got no response from it.
    bit0_high: 400ns
    bit0_low: 850ns
    bit1_high: 800ns
    bit1_low: 450ns
    reset_low: 300us
    channel_colors: GRB
    # DMA with room for a whole frame (71 x 24 bits + reset = 1705 symbols).
    # Without DMA (firmware 0.2.7) the strip showed nothing at all.
    use_dma: true
    rmt_symbols: 1728
    use_psram: false
    power_estimation:
      max_current_ma: ${led_max_current_ma}
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

script:
  - id: status_light_listening
    mode: restart
    then:
      - light.turn_on:
          id: status_light
          brightness: 100%
          red: 0%
          green: 0%
          blue: 100%

  - id: status_light_busy
    mode: restart
    then:
      - light.turn_on:
          id: status_light
          brightness: 100%
          red: 0%
          green: 100%
          blue: 0%

  # Shows the resting state: dim red while muted, otherwise off.
  - id: status_light_idle
    mode: restart
    then:
      - if:
          condition:
            binary_sensor.is_on: mute_button
          then:
            - light.turn_on:
                id: status_light
                brightness: 60%
                red: 100%
                green: 0%
                blue: 0%
          else:
            - light.turn_off: status_light

esphome:
  on_boot:
    # Write the resting state once at start-up so the strip is driven from the
    # beginning and clears anything it latched while the chip was booting.
    - priority: -100
      then:
        - script.execute: status_light_idle
