# LEDs: status colours and the volume display on the DFRobot 24-LED WS2812 ring
# (DATA on GPIO41).
#
#   off            idle, waiting for the wake word
#   blue           wake word heard, listening
#   amber          thinking (waiting for the answer)
#   green          speaking
#   red            muted
#   red, 1 second  something went wrong
#   white arc      volume, for 1.5 seconds after the knob is turned
#   purple circle  a timer is ringing: three LEDs run round the ring
#   orange circle  an alarm is ringing: the same, faster
#                  (both shown even while muted; both colours can be changed
#                  from Home Assistant, see alarm.yaml)
#
# How it works: ring_state holds what the hub is doing. The small scripts at the
# bottom set it and call status_light_apply, which is the one place that decides
# the colour. Ringing (the "ringing" flag in alarm.yaml) wins over everything,
# because it needs attention; then mute; then ring_state.
#
# The ring must always be driven by the firmware. Left undriven, its data line
# floats and picks up noise from the audio signals beside it.
#
# Current limit (hardware constraint): the ring is the only load on its buck
# converter (MPM3610), which can supply about 1.2 A. Each pixel holds a red, a
# green and a blue LED of about 20 mA each at full drive, so 24 pixels at full
# white could ask for 24 x 60 mA = 1.44 A. color_correct scales every channel to
# led_max_level in the driver, for every colour and effect:
#   worst case (white) 24 x 60 mA x 0.80 = 1.15 A
#   one colour         24 x 20 mA x 0.80 = 0.38 A
# If led_count changes, keep  led_count x 0.06 A x led_max_level  under 1.2 A.

substitutions:
  led_count: "24"
  led_max_level: "80%"

light:
  - platform: esp32_rmt_led_strip
    id: status_light
    # Shown in Home Assistant so the ring can be tested by hand. Safe at any
    # colour because of the cap above. M3 decides whether it stays.
    name: Status Ring
    pin: GPIO41
    num_leds: ${led_count}
    # Bit timings copied from the Adafruit NeoPixel library. The first build's
    # strip ignored ESPHome's built-in WS2812 timings (400/1000/1000/400 ns, no
    # reset) and worked with these.
    bit0_high: 400ns
    bit0_low: 850ns
    bit1_high: 800ns
    bit1_low: 450ns
    reset_low: 300us
    channel_colors: GRB
    # Keep the frame buffer in internal RAM; it is read from an interrupt.
    use_psram: false
    color_correct: ["${led_max_level}", "${led_max_level}", "${led_max_level}"]
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    effects:
      # Ringing: three LEDs circle the ring, the leading one in the colour
      # picked in Home Assistant and the two behind it lighter and fainter
      # (drawn by includes/ring_spinner.h). The timer steps every 50 ms, one lap
      # in 1.2 seconds; the alarm every 30 ms, one lap in 0.72 seconds.
      - addressable_lambda:
          name: Ringing Timer
          update_interval: 50ms
          lambda: |-
            static int position = 0;
            position = ring_spinner::draw(it, initial_run ? 0 : position, id(timer_ring_colour));
      - addressable_lambda:
          name: Ringing Alarm
          update_interval: 30ms
          lambda: |-
            static int position = 0;
            position = ring_spinner::draw(it, initial_run ? 0 : position, id(alarm_ring_colour));
      # Lights the first part of the ring in proportion to the volume.
      - addressable_lambda:
          name: Volume
          update_interval: 50ms
          lambda: |-
            const int lit = (int) roundf(id(sat_media_player).volume * it.size());
            for (int i = 0; i < it.size(); i++)
              it[i] = i < lit ? Color(255, 255, 255) : Color::BLACK;

interval:
  # Safety net: re-send the current LED frame once a second.
  #
  # Seen on the hardware (firmware 0.3.1): after a spoken reply the LED output
  # sometimes gets stuck. The ring then freezes on its last colour, and the
  # microphone stops delivering audio, so the wake word goes deaf. Sending any
  # new LED frame clears both at once. This driver refills its signal buffer
  # from an interrupt every 4 LEDs; if that interrupt is delayed while the audio
  # output is being shut down, the frame never ends properly. Re-sending the
  # frame restarts the output, so a stuck state now lasts at most one second.
  - interval: 1s
    then:
      - lambda: static_cast<light::AddressableLight *>(id(status_light).get_output())->schedule_show();

globals:
  # What the hub is doing, as shown on the ring:
  # 0 idle, 1 listening, 2 thinking, 3 speaking.
  - id: ring_state
    type: int
    restore_value: false
    initial_value: "0"

script:
  # The one place that turns ring_state (and mute) into a colour.
  - id: status_light_apply
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(ringing);
          then:
            # The Ringing effects set their own colours; the values here only
            # switch the light on at full brightness.
            - if:
                condition:
                  lambda: return id(ring_kind) == 1;
                then:
                  - light.turn_on:
                      id: status_light
                      brightness: 100%
                      red: 100%
                      green: 100%
                      blue: 100%
                      effect: Ringing Alarm
                else:
                  - light.turn_on:
                      id: status_light
                      brightness: 100%
                      red: 100%
                      green: 100%
                      blue: 100%
                      effect: Ringing Timer
          else:
            - if:
                condition:
                  binary_sensor.is_on: mute_button
                then:
                  - light.turn_on:
                      id: status_light
                      effect: none
                      brightness: 70%
                      red: 100%
                      green: 0%
                      blue: 0%
                else:
                  - if:
                      condition:
                        lambda: return id(ring_state) == 1;
                      then:
                        - light.turn_on:
                            id: status_light
                            effect: none
                            brightness: 100%
                            red: 0%
                            green: 0%
                            blue: 100%
                      else:
                        - if:
                            condition:
                              lambda: return id(ring_state) == 2;
                            then:
                              - light.turn_on:
                                  id: status_light
                                  effect: none
                                  brightness: 100%
                                  red: 100%
                                  green: 55%
                                  blue: 0%
                            else:
                              - if:
                                  condition:
                                    lambda: return id(ring_state) == 3;
                                  then:
                                    - light.turn_on:
                                        id: status_light
                                        effect: none
                                        brightness: 100%
                                        red: 0%
                                        green: 100%
                                        blue: 0%
                                  else:
                                    - light.turn_off: status_light

  - id: status_light_idle
    mode: restart
    then:
      - globals.set:
          id: ring_state
          value: "0"
      - script.execute: status_light_apply

  - id: status_light_listening
    mode: restart
    then:
      - globals.set:
          id: ring_state
          value: "1"
      - script.execute: status_light_apply

  - id: status_light_thinking
    mode: restart
    then:
      - globals.set:
          id: ring_state
          value: "2"
      - script.execute: status_light_apply

  - id: status_light_speaking
    mode: restart
    then:
      - globals.set:
          id: ring_state
          value: "3"
      - script.execute: status_light_apply

  # A one-second red flash, then back to idle.
  - id: status_light_error
    mode: restart
    then:
      - light.turn_on:
          id: status_light
          effect: none
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
      - delay: 1s
      - script.execute: status_light_idle

  # Shows the volume as a white arc for 1.5 seconds, then returns to whatever
  # the hub is doing. Turning the knob again restarts the 1.5 seconds.
  - id: status_light_volume
    mode: restart
    then:
      - light.turn_on:
          id: status_light
          brightness: 100%
          red: 100%
          green: 100%
          blue: 100%
          effect: Volume
      - delay: 1500ms
      - script.execute: status_light_apply

esphome:
  on_boot:
    # Write the resting state once at start-up so the ring is driven from the
    # beginning and clears anything it latched while the chip was booting.
    - priority: -100
      then:
        - script.execute: status_light_idle
