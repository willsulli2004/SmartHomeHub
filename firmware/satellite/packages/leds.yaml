# LEDs: status colours on the WS2812B strip (DATA on GPIO41).
#
# M2 only shows a solid colour per state. M3 adds the full set of LED states and
# animations and the encoder's pixel.
#
#   off         idle, waiting for the wake word
#   blue        wake word heard, listening
#   green       thinking / speaking
#   dim red     muted
#
# The strip must always be driven by the firmware. Left undriven, its data line
# floats and picks up noise from the audio output, which lights it at random.
#
# Current limit (hardware constraint): the strip is the only load on its buck
# converter (MPM3610), which can supply about 1.2 A. Each WS2812B pixel holds a
# red, a green and a blue LED of about 20 mA each at full drive, so:
#   one colour, all 71 pixels, full drive:   71 x 20 mA = 1.4 A
#   white (all three), full drive:           71 x 60 mA = 4.3 A
#
# How the limit is kept (agreed with Will for M2):
#   1. color_correct scales every channel to led_max_level in the driver.
#   2. The scripts below only ever light ONE colour channel at a time.
#   Worst case is then 71 x 20 mA x 0.70 = 1.0 A.
#
# This is NOT safe for white or mixed colours: white at this level would ask for
# about 3 A. So the strip is internal (not adjustable from Home Assistant), and
# anything added here must keep to one channel until M3 adds a limiter that
# checks each frame. If led_count or led_max_level changes, keep
#   led_count x 0.02 A x led_max_level  under 1.2 A.

substitutions:
  led_count: "71"
  led_max_level: "70%"

light:
  - platform: esp32_rmt_led_strip
    id: status_light
    internal: true
    pin: GPIO41
    num_leds: ${led_count}
    # Bit timings copied from the Adafruit NeoPixel library, which drove this strip
    # correctly in the Arduino all-components test. ESPHome's built-in WS2812
    # timings (400/1000/1000/400 ns, no reset) got no response from it.
    bit0_high: 400ns
    bit0_low: 850ns
    bit1_high: 800ns
    bit1_low: 450ns
    reset_low: 300us
    channel_colors: GRB
    # Keep the frame buffer in internal RAM; it is read from an interrupt.
    # DMA (use_dma) is deliberately not used: in firmware 0.2.6 the strip stopped
    # updating for good after the first voice reply with DMA enabled.
    use_psram: false
    color_correct: ["${led_max_level}", "${led_max_level}", "${led_max_level}"]
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

script:
  - id: status_light_listening
    mode: restart
    then:
      - light.turn_on:
          id: status_light
          brightness: 100%
          red: 0%
          green: 0%
          blue: 100%

  - id: status_light_busy
    mode: restart
    then:
      - light.turn_on:
          id: status_light
          brightness: 100%
          red: 0%
          green: 100%
          blue: 0%

  # Shows the resting state: dim red while muted, otherwise off.
  - id: status_light_idle
    mode: restart
    then:
      - if:
          condition:
            binary_sensor.is_on: mute_button
          then:
            - light.turn_on:
                id: status_light
                brightness: 60%
                red: 100%
                green: 0%
                blue: 0%
          else:
            - light.turn_off: status_light

esphome:
  on_boot:
    # Write the resting state once at start-up so the strip is driven from the
    # beginning and clears anything it latched while the chip was booting.
    - priority: -100
      then:
        - script.execute: status_light_idle
