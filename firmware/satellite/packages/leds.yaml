# LEDs: a temporary status light on the devkit's onboard RGB LED (GPIO48).
#
# This exists so M2 can be tested without watching the log. M3 replaces it with
# the real LED states on the WS2812B strip and the encoder's pixel.
#
#   off         idle, waiting for the wake word
#   blue        wake word heard, listening
#   green       thinking / speaking
#   dim red     muted

light:
  - platform: esp32_rmt_led_strip
    id: status_light
    internal: true
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

script:
  - id: status_light_listening
    mode: restart
    then:
      - light.turn_on:
          id: status_light
          brightness: 40%
          red: 0%
          green: 0%
          blue: 100%

  - id: status_light_busy
    mode: restart
    then:
      - light.turn_on:
          id: status_light
          brightness: 40%
          red: 0%
          green: 100%
          blue: 0%

  # Shows the resting state: dim red while muted, otherwise off.
  - id: status_light_idle
    mode: restart
    then:
      - if:
          condition:
            binary_sensor.is_on: mute_button
          then:
            - light.turn_on:
                id: status_light
                brightness: 25%
                red: 100%
                green: 0%
                blue: 0%
          else:
            - light.turn_off: status_light
