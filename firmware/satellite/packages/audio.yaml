# Audio: microphone in, DAC/amp out, and the speaker level cap.
#
# The mic and the DAC each get their own I2S bus, so capture and playback can run
# at different sample rates at the same time.

substitutions:
  # Hard rule 3: the speaker level must never exceed 0.5 of digital full scale
  # (-6 dBFS), because the PCM5102's 2.1 Vrms full scale overdrives the MAX9744.
  #
  # How ESPHome 2026.11 turns volume into level (read from its source,
  # i2s_audio_speaker.cpp and speaker_media_player.cpp):
  #   - The I2S speaker applies software gain in decibels:
  #       gain_dB = -49 * (1 - speaker_volume)      speaker_volume 1.0 = 0 dB
  #   - The media player maps its 0..100% onto volume_min..volume_max before
  #     handing the value to the speaker.
  # So the cap is a speaker_volume of 1 - 6.02/49 = 0.877. With volume_max 0.87:
  #       100% -> -49 * 0.13 = -6.37 dBFS = 0.48 of full scale   (under the cap)
  #        50% -> -27.7 dBFS, close to the Arduino test's 30% default (-27 dB)
  #
  # Do not raise this value. Nothing may play through the I2S speaker directly;
  # every sound goes through the media player below so this limit always applies.
  speaker_volume_max: "0.87"
  speaker_volume_initial: "0.5"

i2s_audio:
  # ICS-43434 microphone.
  - id: i2s_mic_bus
    i2s_bclk_pin: GPIO42
    i2s_lrclk_pin: GPIO1
  # PCM5102 DAC -> MAX9744 amp (analog volume mode, left input).
  - id: i2s_spk_bus
    i2s_bclk_pin: GPIO40
    i2s_lrclk_pin: GPIO38

microphone:
  # 24-bit samples in a 32-bit slot, left channel (SEL tied to GND), 16 kHz.
  # Gain is applied where the audio is consumed; see mic_gain_factor in voice.yaml.
  - platform: i2s_audio
    id: sat_mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO2
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: left

speaker:
  # Mono audio on the left channel, which is the amp's only connected input.
  - platform: i2s_audio
    id: i2s_spk
    i2s_audio_id: i2s_spk_bus
    i2s_dout_pin: GPIO39
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: left
    buffer_duration: 100ms
    # The output is left on ESPHome's defaults: it stops 500 ms after each sound.
    # Known issue (M2): the speaker hums when idle. Tests on the hardware showed
    # the hum is loudest while the I2S output is running and quietest in this
    # default stopped state, so keeping the output alive makes it worse:
    #   - "timeout: never" on this speaker also makes the voice assistant ignore
    #     the wake word (firmware 0.2.2);
    #   - "keep_alive: true" and a mixer with a never-stopping output did not help
    #     (0.2.3, 0.2.4).
    # The hum is not fixable in firmware alone. The planned fix is the amp's MUTE
    # pin (see docs/milestones/M02-esphome-satellite-base.md).

script:
  # Un-mutes the amp and cancels any pending re-mute.
  - id: amp_wake
    mode: restart
    then:
      - script.stop: amp_sleep
      - switch.turn_off: amp_mute

  # Mutes the amp once nothing has played for a second. A new sound within that
  # second cancels it (amp_wake stops this script).
  - id: amp_sleep
    mode: restart
    then:
      - delay: 1s
      - switch.turn_on: amp_mute

  # Lowers the drive strength of the three DAC signal pins from the default
  # (about 20 mA) to the weakest setting (about 5 mA). Weaker drive means slower
  # signal edges, and slower edges couple far less interference into neighbouring
  # wires. The LED data wire (GPIO41) sits right beside these pins, and in the
  # first build the LED strip froze on its last colour whenever the speaker played.
  # 5 mA is ample for the short wires to the DAC.
  - id: soften_dac_signals
    mode: restart
    then:
      - lambda: |-
          gpio_set_drive_capability(GPIO_NUM_38, GPIO_DRIVE_CAP_0);
          gpio_set_drive_capability(GPIO_NUM_39, GPIO_DRIVE_CAP_0);
          gpio_set_drive_capability(GPIO_NUM_40, GPIO_DRIVE_CAP_0);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: soften_dac_signals

switch:
  # MAX9744 MUTE on GPIO4. Grounding MUTE silences the amp, including its idle
  # hum; releasing it lets the amp board's own weak pull bring it back to
  # "playing" (Will measured the pin floating between about 0 and 3 V).
  #
  # Open-drain only: the ESP32 either pulls the pin to ground or lets go. It
  # never drives it high. ON = muted.
  #
  # Will fitted and tested the wire in M3.
  - platform: gpio
    id: amp_mute
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      number: GPIO4
      inverted: true
      mode:
        output: true
        open_drain: true

media_player:
  # The only route to the speaker. Voice replies, the volume knob and the timer
  # ring (M4) and the alarm ring (M5) use it, so all of them inherit the cap.
  - platform: speaker
    id: sat_media_player
    name: Media Player
    announcement_pipeline:
      speaker: i2s_spk
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    volume_initial: ${speaker_volume_initial}
    volume_min: 0.0
    volume_max: ${speaker_volume_max}
    volume_increment: 0.02
    # Sounds built into the firmware. They play through this media player like
    # everything else, so the cap above applies to them.
    files:
      # The rings for a finished timer and for an alarm; the files are chosen
      # in alarm.yaml.
      - id: timer_sound
        file: ${timer_sound_file}
      - id: alarm_sound
        file: ${alarm_sound_file}
    # Un-mute the amp as soon as a sound is on its way, and mute it again once
    # playback has been idle for a second.
    on_announcement:
      - script.execute: amp_wake
    on_play:
      - script.execute: amp_wake
    on_idle:
      - script.execute: amp_sleep
