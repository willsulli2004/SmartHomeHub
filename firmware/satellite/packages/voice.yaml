# Voice: on-device wake word and the Home Assistant voice assistant.
#
# Flow: micro_wake_word hears "Hey Jarvis" on the device -> voice_assistant streams
# the following speech to Home Assistant -> the reply plays through the media
# player in audio.yaml. No audio leaves the device until the wake word is heard.

substitutions:
  # Digital microphone gain, 1 to 64. The Arduino tests proved +30 dB for far-field
  # pickup (a shift of 11 instead of 16 from the 32-bit slot = 2^5 = 32x).
  # Lower it if close or loud speech clips; raise it if the wake word is missed
  # from across the room.
  mic_gain_factor: "32"

micro_wake_word:
  id: mww
  microphone:
    microphone: sat_mic
    channels: 0
    gain_factor: ${mic_gain_factor}
  stop_after_detection: false
  models:
    - model: hey_jarvis
      id: hey_jarvis
  vad:
  on_wake_word_detected:
    - if:
        condition:
          not:
            voice_assistant.is_running:
        then:
          - voice_assistant.start:
              wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone:
    microphone: sat_mic
    channels: 0
    gain_factor: ${mic_gain_factor}
  media_player: sat_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  # Wake word detection only runs while Home Assistant is connected and the
  # device is not muted.
  on_client_connected:
    - if:
        condition:
          binary_sensor.is_off: mute_button
        then:
          - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
  on_listening:
    - script.execute: status_light_listening
    # Re-apply before every reply, in case setting up the audio output resets it.
    - script.execute: soften_dac_signals
  on_stt_end:
    - script.execute: status_light_busy
  on_end:
    # "End" fires when Home Assistant finishes its part, which is before the
    # reply has been spoken. Wait for the reply to finish playing so the strip
    # stays green while the satellite talks. (Turning it off straight away also
    # sent two LED frames 4 ms apart.)
    - wait_until:
        condition:
          not:
            voice_assistant.is_running:
        timeout: 30s
    # Let the audio output finish shutting down before sending the LED frame.
    - delay: 500ms
    - script.execute: status_light_idle
  on_error:
    - script.execute: status_light_idle

sensor:
  # Microphone level as the wake word engine hears it (same gain applied), shown
  # in Home Assistant under Diagnostic. Used to tune mic_gain_factor and to see
  # how much noise the enclosure adds. Readings are in dB relative to full scale:
  # 0 dB is the loudest the microphone path can represent, so a peak sitting at or
  # near 0 dB means the signal is clipping. It only measures while something else
  # (the wake word engine) already has the microphone running.
  - platform: sound_level
    id: mic_level
    microphone:
      microphone: sat_mic
      channels: 0
      gain_factor: ${mic_gain_factor}
    passive: true
    measurement_duration: 1000ms
    peak:
      name: Mic Peak
      entity_category: diagnostic
    rms:
      name: Mic Level
      entity_category: diagnostic
