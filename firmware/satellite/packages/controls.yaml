# Controls: the mute button and the volume knob.
#
# Mute button: a latching switch from GPIO5 to GND. Latched (closed) = muted.
# While muted: wake word detection is stopped, any conversation in progress is
# stopped, and the microphone is muted, so no audio leaves the device.
#
# Volume knob: an Adafruit I2C rotary encoder (seesaw), read by the project's own
# component in components/seesaw_encoder/. Each click moves the volume by the
# media player's volume_increment (2%). The knob changes volume through the media
# player, never the speaker directly, so the speaker level cap in audio.yaml
# applies to it. Only rotation is used: the enclosure cannot press the knob.

i2c:
  - id: i2c_bus
    sda: GPIO21
    scl: GPIO47
    frequency: 100kHz
    scan: true

seesaw_encoder:
  id: volume_knob
  i2c_id: i2c_bus
  address: 0x36
  # Set to true if turning clockwise makes it quieter.
  inverted: false
  on_clockwise:
    - media_player.volume_up: sat_media_player
    - script.execute: status_light_volume
  on_anticlockwise:
    - media_player.volume_down: sat_media_player
    - script.execute: status_light_volume

binary_sensor:
  - platform: gpio
    id: mute_button
    name: Mute
    icon: mdi:microphone-off
    pin:
      # GPIO5 is an ordinary pin. The first build used GPIO45, a strapping pin
      # that must be low at boot (hard rule 1); nothing is connected to it now.
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      - script.execute: mute_on
    on_release:
      - script.execute: mute_off

script:
  - id: mute_on
    mode: restart
    then:
      - voice_assistant.stop:
      - micro_wake_word.stop:
      - microphone.mute: sat_mic
      - script.execute: status_light_idle

  - id: mute_off
    mode: restart
    then:
      - microphone.unmute: sat_mic
      - if:
          condition:
            voice_assistant.connected:
          then:
            - micro_wake_word.start:
      - script.execute: status_light_idle

esphome:
  on_boot:
    # If the device powers up with the button already latched, apply mute before
    # anything can listen. Runs late, after the mic and button are set up.
    - priority: -100
      then:
        - if:
            condition:
              binary_sensor.is_on: mute_button
            then:
              - script.execute: mute_on
