# Alarms dashboard (M5): set and change alarms from the Home Assistant app, and
# tune how timers and alarms ring. Alarms set here ring on the hub exactly like
# alarms set by voice, because both write the same five alarm slots.
#
# This file is pasted into a dashboard's "Raw configuration editor"; the steps
# are in section 14.11 of docs/setup/home-assistant.md. It is not copied into
# /config like the package.
#
# To set an alarm: pick a slot's time, then switch that slot on. It rings the
# next time the clock reaches that time and then switches itself off.
#
# The second page, Robot (M6), shows the alarm robot: whether it is online, its
# battery, and the wake-up history worked out by the alarm analytics service.
#
# The satellite_hub_... entities are the settings firmware 0.6.0 adds to the
# satellite; the hub_robot_... entities come from packages/hub_robot.yaml and
# from the alarm analytics service. If your entity ids differ, a card shows "Entity not available";
# edit that row in the dashboard and pick the right entity.

title: Alarms
views:
  - title: Alarms
    path: alarms
    icon: mdi:alarm
    cards:
      # Only visible while an alarm is going off.
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.hub_alarm_ringing
            state: "on"
        card:
          type: button
          name: Stop the alarm
          icon: mdi:alarm-off
          show_state: false
          tap_action:
            action: perform-action
            perform_action: script.hub_alarm_stop
            data:
              reason: user

      - type: entities
        title: Alarms
        show_header_toggle: false
        entities:
          - type: section
            label: Alarm 1
          - entity: input_datetime.hub_alarm_1
            name: Time
          - entity: input_boolean.hub_alarm_1
            name: "On"
          - type: section
            label: Alarm 2
          - entity: input_datetime.hub_alarm_2
            name: Time
          - entity: input_boolean.hub_alarm_2
            name: "On"
          - type: section
            label: Alarm 3
          - entity: input_datetime.hub_alarm_3
            name: Time
          - entity: input_boolean.hub_alarm_3
            name: "On"
          - type: section
            label: Alarm 4
          - entity: input_datetime.hub_alarm_4
            name: Time
          - entity: input_boolean.hub_alarm_4
            name: "On"
          - type: section
            label: Alarm 5
          - entity: input_datetime.hub_alarm_5
            name: Time
          - entity: input_boolean.hub_alarm_5
            name: "On"

      - type: entities
        title: How alarms ring
        show_header_toggle: false
        entities:
          - entity: number.satellite_hub_alarm_volume
            name: Volume
          - entity: light.satellite_hub_alarm_ring_colour
            name: Light colour
          - entity: input_number.hub_alarm_timeout_minutes
            name: Give up after
          - type: button
            name: Ring the alarm now (test)
            icon: mdi:alarm-bell
            action_name: Ring
            tap_action:
              action: perform-action
              perform_action: script.hub_alarm_start
              confirmation:
                text: Start the alarm on the hub now?

      - type: entities
        title: How timers ring
        show_header_toggle: false
        entities:
          - entity: number.satellite_hub_timer_volume_min
            name: Quietest volume
          - entity: number.satellite_hub_timer_volume_max
            name: Loudest volume
          - entity: light.satellite_hub_timer_ring_colour
            name: Light colour
          - entity: number.satellite_hub_timer_ring_timeout
            name: Give up after

      - type: entities
        title: Status
        show_header_toggle: false
        entities:
          - entity: binary_sensor.satellite_hub_ringing
            name: Hub is ringing
          - entity: input_text.hub_alarm_active_id
            name: Last alarm id

  - title: Robot
    path: robot
    icon: mdi:robot
    cards:
      - type: entities
        title: Robot
        show_header_toggle: false
        entities:
          - entity: binary_sensor.hub_robot_online
            name: Online
          - entity: sensor.hub_robot_state
            name: Doing
          - entity: sensor.hub_robot_battery
            name: Battery
          - entity: sensor.hub_robot_battery_level
            name: Battery level
          - entity: binary_sensor.hub_robot_battery_low
            name: Battery low
          - entity: binary_sensor.hub_robot_battery_critical
            name: Battery critical

      - type: entities
        title: Last alarm
        show_header_toggle: false
        entities:
          - entity: sensor.hub_robot_last_stop_reason
            name: Stopped by
          - entity: sensor.hub_robot_last_wake_up_delay
            name: Wake-up delay
          - entity: sensor.hub_robot_last_time_to_catch
            name: Time to catch
          - entity: sensor.hub_robot_last_distance
            name: Distance the robot ran
          - entity: sensor.hub_robot_last_catch
            name: Catch check

      - type: entities
        title: Last 7 days
        show_header_toggle: false
        entities:
          - entity: sensor.hub_robot_wake_up_delay_7_day_average
            name: Average wake-up delay
          - entity: sensor.hub_robot_time_to_catch_7_day_average
            name: Average time to catch
          - entity: sensor.hub_robot_alarms_in_7_days
            name: Alarms
          - entity: sensor.hub_robot_catches_in_7_days
            name: Real catches
          - entity: sensor.hub_robot_suspicious_catches_in_7_days
            name: Suspicious catches

      - type: history-graph
        title: Wake-up history (7 days)
        hours_to_show: 168
        entities:
          - entity: sensor.hub_robot_last_wake_up_delay
            name: Wake-up delay
          - entity: sensor.hub_robot_last_time_to_catch
            name: Time to catch

      - type: history-graph
        title: Battery (24 hours)
        hours_to_show: 24
        entities:
          - entity: sensor.hub_robot_battery
            name: Battery

      - type: entities
        title: Robot settings
        show_header_toggle: false
        entities:
          - entity: number.hub_robot_shortest_real_lift
            name: Shortest lift that counts as a catch
          - entity: number.hub_robot_battery_warning_level
            name: Warn when the battery is below
