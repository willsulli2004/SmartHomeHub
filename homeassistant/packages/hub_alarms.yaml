        response_variable: result
    speech:
      text: "{{ action_response.speech }}"

  HubQueryAlarm:
    action:
      - action: script.hub_alarm_query
        response_variable: result
      - stop: ""
        response_variable: result
    speech:
      text: "{{ action_response.speech }}"
