# Hub alarms (M5): the alarm data, what happens when one fires, every way it
# stops, the MQTT messages for the robot, and the voice commands.
#
# Goes on Home Assistant at /config/packages/hub_alarms.yaml (see homeassistant/README.md).
#
# Layers (CLAUDE.md's four-layer design):
#   helpers      the alarm slots and the ringing state, further down
#   scripts      hub_alarm_start / hub_alarm_stop, the only things that start or
#                stop an alarm, plus the scripts behind the voice commands
#   events       hub_alarm_started / hub_alarm_stopped, fired by those two scripts
#   triggers     automations that react: alarm time reached, knob or voice stop on
#                the satellite, the robot's "caught", the timeout, and the MQTT
#                publishing, which only listens for the two events
#
# Home Assistant owns the alarm. The satellite only rings when told to and
# reports whether it is ringing; it never talks to the MQTT broker.
#
# Names this file expects from the satellite (firmware 0.6.0). If yours differ,
# change them here; each is used in one or two places:
#   action   esphome.sat_hub_alarm_ring
#   action   esphome.sat_hub_stop_ring
#   entity   binary_sensor.satellite_hub_ringing
#
# There are five alarm slots. Each is a time of day plus an on/off switch, so an
# alarm can be set from the app as easily as by voice: pick a time, switch it
# on. A slot that is on fires the next time the clock reaches its time, then
# switches itself off (alarms fire once). To add slots, add helpers 6, 7...
# and extend every "range(1, 6)" and the trigger list in "Hub alarm: fire".

# ---------------------------------------------------------------- helpers ----

input_datetime:
  hub_alarm_1:
    name: Alarm 1 time
    has_date: false
    has_time: true
    icon: mdi:alarm
  hub_alarm_2:
    name: Alarm 2 time
    has_date: false
    has_time: true
    icon: mdi:alarm
  hub_alarm_3:
    name: Alarm 3 time
    has_date: false
    has_time: true
    icon: mdi:alarm
  hub_alarm_4:
    name: Alarm 4 time
    has_date: false
    has_time: true
    icon: mdi:alarm
  hub_alarm_5:
    name: Alarm 5 time
    has_date: false
    has_time: true
    icon: mdi:alarm

input_boolean:
  hub_alarm_1:
    name: Alarm 1
    icon: mdi:alarm-check
  hub_alarm_2:
    name: Alarm 2
    icon: mdi:alarm-check
  hub_alarm_3:
    name: Alarm 3
    icon: mdi:alarm-check
  hub_alarm_4:
    name: Alarm 4
    icon: mdi:alarm-check
  hub_alarm_5:
    name: Alarm 5
    icon: mdi:alarm-check
  # On while an alarm is going off. Do not switch this by hand; use the scripts.
  hub_alarm_ringing:
    name: Alarm ringing
    icon: mdi:alarm-light

input_text:
  # The id of the alarm that is ringing, or that rang last. Sent to the robot.
  hub_alarm_active_id:
    name: Alarm active id
    max: 40
    icon: mdi:identifier

input_number:
  # How long an alarm rings before it gives up. Change it from the app. There is
  # no "initial" here on purpose: with one, the value would reset at every
  # restart. A new install starts at the minimum, so set it once (README).
  hub_alarm_timeout_minutes:
    name: Alarm timeout
    min: 1
    max: 30
    step: 1
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-off-outline

# ---------------------------------------------------------------- scripts ----

script:
  # Starts an alarm going off. Does nothing if one already is.
  hub_alarm_start:
    alias: "Hub alarm: start"
    mode: queued
    sequence:
      - if:
          - condition: state
            entity_id: input_boolean.hub_alarm_ringing
            state: "on"
        then:
          - stop: "An alarm is already ringing"
      - variables:
          alarm_id: "alarm-{{ now().timestamp() | int }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.hub_alarm_active_id
        data:
          value: "{{ alarm_id }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hub_alarm_ringing
      # The event goes out before the satellite is asked to ring, so the robot
      # is told even if the satellite is offline.
      - event: hub_alarm_started
        event_data:
          alarm_id: "{{ alarm_id }}"
      - action: esphome.sat_hub_alarm_ring
        continue_on_error: true

  # Stops the alarm that is going off. "reason" is caught, user or timeout.
  hub_alarm_stop:
    alias: "Hub alarm: stop"
    mode: queued
    fields:
      reason:
        description: Why it stopped (caught, user or timeout).
        example: user
    sequence:
      - if:
          - condition: state
            entity_id: input_boolean.hub_alarm_ringing
            state: "off"
        then:
          - stop: "No alarm is ringing"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hub_alarm_ringing
      - event: hub_alarm_stopped
        event_data:
          alarm_id: "{{ states('input_text.hub_alarm_active_id') }}"
          reason: "{{ reason | default('user') }}"
      - action: esphome.sat_hub_stop_ring
        continue_on_error: true

  # Turns the words said for a time into an hour and minute. Used by the set and
  # cancel scripts. Speech-to-text writes times many ways ("3:10 PM", "3:10pm",
  # "3.10 p.m.", "310 PM", "three ten in the afternoon"), so the phrase files
  # hand over whatever was said and this script makes sense of it.
  #
  # Returns ok (false if no time was found), minute, and hours: the 24-hour
  # hours it could mean. With am or pm that is one hour; without, "7" could be
  # 7 or 19 and both are returned.
  #
  # The patterns avoid backslashes on purpose ([0-9] and [ ] instead of the
  # usual shorthands), so nothing depends on how quoting treats them.
  hub_alarm_parse_time:
    alias: "Hub alarm: understand a spoken time"
    mode: parallel
    max: 10
    fields:
      text:
        description: The time as it was said.
        example: "7:30 pm"
    sequence:
      - variables:
          parsed: >-
            {% set ns = namespace(t=(text | default('') | string | lower | trim), ok=false, hours=[], minute=0) %}
            {% set ns.t = ns.t | regex_replace('^said:', '') | trim %}
            {% set ns.t = ns.t | regex_replace('[.,!?]+$', '') %}
            {% set swaps = [
              ['(?<![a-z])a[.]?[ ]?m(?![a-z])[.]?', ' am '],
              ['(?<![a-z])p[.]?[ ]?m(?![a-z])[.]?', ' pm '],
              ['in the morning|this morning', ' am '],
              ['in the afternoon|this afternoon|in the evening|this evening|at night|tonight', ' pm '],
              ['(?<![a-z])(today|tomorrow|sharp|exactly)(?![a-z])', ' '],
              ['(?<![a-z])o.?clock(?![a-z])', ' '],
              ['(?<![a-z])forty[ -]five(?![a-z])', '45'],
              ['(?<![a-z])(oh|o)[ ]five(?![a-z])', '05'],
              ['(?<![a-z])fifteen(?![a-z])', '15'],
              ['(?<![a-z])twenty(?![a-z])', '20'],
              ['(?<![a-z])thirty(?![a-z])', '30'],
              ['(?<![a-z])forty(?![a-z])', '40'],
              ['(?<![a-z])fifty(?![a-z])', '50'],
              ['(?<![a-z])twelve(?![a-z])', '12'],
              ['(?<![a-z])eleven(?![a-z])', '11'],
              ['(?<![a-z])ten(?![a-z])', '10'],
              ['(?<![a-z])nine(?![a-z])', '9'],
              ['(?<![a-z])eight(?![a-z])', '8'],
              ['(?<![a-z])seven(?![a-z])', '7'],
              ['(?<![a-z])six(?![a-z])', '6'],
              ['(?<![a-z])five(?![a-z])', '5'],
              ['(?<![a-z])four(?![a-z])', '4'],
              ['(?<![a-z])three(?![a-z])', '3'],
              ['(?<![a-z])two(?![a-z])', '2'],
              ['(?<![a-z])one(?![a-z])', '1']
            ] %}
            {% for swap in swaps %}
              {% set ns.t = ns.t | regex_replace(swap[0], swap[1]) %}
            {% endfor %}
            {% set ns.t = ns.t | regex_replace('[ ]+', ' ') | trim %}
            {% if ns.t in ['noon', 'midday', '12 noon'] %}
              {% set ns.ok = true %}
              {% set ns.hours = [12] %}
            {% elif ns.t in ['midnight', '12 midnight'] %}
              {% set ns.ok = true %}
              {% set ns.hours = [0] %}
            {% else %}
              {% set found = ns.t | regex_findall('^([0-9]{1,2})(?:[ ]?[:.-][ ]?([0-9]{2})|[ ]([0-9]{2})|([0-9]{2}))?[ ]?(am|pm)?$') %}
              {% if found | length > 0 %}
                {% set g = found[0] %}
                {% set h = g[0] | int %}
                {% set m = (g[1] or g[2] or g[3] or '0') | int %}
                {% if h <= 23 and m <= 59 %}
                  {% set ns.ok = true %}
                  {% set ns.minute = m %}
                  {% if h == 0 or h > 12 %}
                    {% set ns.hours = [h] %}
                  {% elif g[4] == 'am' %}
                    {% set ns.hours = [h % 12] %}
                  {% elif g[4] == 'pm' %}
                    {% set ns.hours = [h % 12 + 12] %}
                  {% else %}
                    {% set ns.hours = [h % 12, h % 12 + 12] %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endif %}
            {{ {'ok': ns.ok, 'hours': ns.hours, 'minute': ns.minute} }}
      - stop: "Parsed"
        response_variable: parsed

  # Voice: "set an alarm for 7:30 AM". Picks the first free slot.
  hub_alarm_set:
    alias: "Hub alarm: set by voice"
    mode: queued
    fields:
      when:
        description: The time as it was said.
        example: "7:30 am"
    sequence:
      - action: script.hub_alarm_parse_time
        data:
          text: "{{ when | default('') }}"
        response_variable: parsed
      - if:
          - condition: template
            value_template: "{{ not parsed.ok }}"
        then:
          - variables:
              result:
                speech: "Sorry, I didn't catch the time. Say it like seven thirty A M."
          - stop: "No time understood"
            response_variable: result
      - variables:
          # Of the hours it could mean, the one that comes round soonest. An
          # alarm for the current minute means tomorrow.
          hour24: >-
            {% set clock = now().hour * 60 + now().minute %}
            {% set ns = namespace(best=-1, wait=9999) %}
            {% for h in parsed.hours %}
              {% set wait = (h * 60 + parsed.minute - clock) % 1440 %}
              {% set wait = 1440 if wait == 0 else wait %}
              {% if wait < ns.wait %}
                {% set ns.wait = wait %}
                {% set ns.best = h %}
              {% endif %}
            {% endfor %}
            {{ ns.best }}
      - variables:
          # The slot's value, "HH:MM:SS".
          target: "{{ '%02d:%02d:00' | format(hour24 | int, parsed.minute | int) }}"
          # How the time is spoken: "7 AM", "7:30 PM", plus "tomorrow" if so.
          spoken: >-
            {% set h = hour24 | int %}
            {% set m = parsed.minute | int %}
            {{ h % 12 or 12 }}{{ ':%02d' | format(m) if m else '' }} {{ 'AM' if h < 12 else 'PM' }}{{ ' tomorrow' if h * 60 + m <= now().hour * 60 + now().minute else '' }}
          # An alarm already set for this time, if any.
          duplicate: >-
            {% set ns = namespace(found=false) %}
            {% for i in range(1, 6) %}
              {% if is_state('input_boolean.hub_alarm_' ~ i, 'on')
                    and states('input_datetime.hub_alarm_' ~ i) == target %}
                {% set ns.found = true %}
              {% endif %}
            {% endfor %}
            {{ ns.found }}
          # The first free slot, or 0 if all are in use.
          slot: >-
            {% set ns = namespace(n=0) %}
            {% for i in range(1, 6) %}
              {% if ns.n == 0 and is_state('input_boolean.hub_alarm_' ~ i, 'off') %}
                {% set ns.n = i %}
              {% endif %}
            {% endfor %}
            {{ ns.n }}
      - if:
          - condition: template
            value_template: "{{ duplicate }}"
        then:
          - variables:
              result:
                speech: "You already have an alarm for {{ spoken }}."
          - stop: "Duplicate"
            response_variable: result
      - if:
          - condition: template
            value_template: "{{ slot | int == 0 }}"
        then:
          - variables:
              result:
                speech: "All five alarms are in use. Cancel one first."
          - stop: "No free slot"
            response_variable: result
      - action: input_datetime.set_datetime
        target:
          entity_id: "input_datetime.hub_alarm_{{ slot }}"
        data:
          time: "{{ target }}"
      - action: input_boolean.turn_on
        target:
          entity_id: "input_boolean.hub_alarm_{{ slot }}"
      - variables:
          result:
            speech: "Alarm set for {{ spoken }}."
      - stop: "Alarm set"
        response_variable: result

  # Voice: "cancel my alarm" and "cancel my 7 AM alarm". Also stops an alarm
  # that is going off ("stop the alarm").
  hub_alarm_cancel:
    alias: "Hub alarm: cancel by voice"
    mode: queued
    fields:
      when:
        description: The time as it was said, or empty if no time was said.
        example: "7 am"
    sequence:
      - if:
          - condition: state
            entity_id: input_boolean.hub_alarm_ringing
            state: "on"
        then:
          - action: script.hub_alarm_stop
            data:
              reason: user
          - variables:
              result:
                speech: "Alarm stopped."
          - stop: "Stopped the ringing alarm"
            response_variable: result
      - action: script.hub_alarm_parse_time
        data:
          text: "{{ when | default('') }}"
        response_variable: parsed
      - variables:
          time_given: "{{ (when | default('') | string | regex_replace('^said:', '') | trim) != '' }}"
          # Slots that are switched on.
          active: >-
            {% set ns = namespace(list=[]) %}
            {% for i in range(1, 6) %}
              {% if is_state('input_boolean.hub_alarm_' ~ i, 'on') %}
                {% set ns.list = ns.list + [i] %}
              {% endif %}
            {% endfor %}
            {{ ns.list }}
      - variables:
          # Slots to cancel: the only alarm if no time was said, otherwise every
          # alarm at that clock time. Without am or pm, both halves of the day
          # match.
          matches: >-
            {% set ns = namespace(list=[]) %}
            {% if not time_given %}
              {% if active | length == 1 %}
                {% set ns.list = active %}
              {% endif %}
            {% elif parsed.ok %}
              {% for i in active %}
                {% set s = states('input_datetime.hub_alarm_' ~ i) %}
                {% if (s[0:2] | int(-1)) in parsed.hours and (s[3:5] | int(-1)) == parsed.minute %}
                  {% set ns.list = ns.list + [i] %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.list }}
      - if:
          - condition: template
            value_template: "{{ active | length == 0 }}"
        then:
          - variables:
              result:
                speech: "You have no alarms set."
          - stop: "No alarms"
            response_variable: result
      - if:
          - condition: template
            value_template: "{{ matches | length == 0 }}"
        then:
          - variables:
              result:
                speech: >-
                  {% if not time_given %}
                    You have {{ active | length }} alarms. Say which one to cancel, or say cancel all alarms.
                  {% elif not parsed.ok %}
                    Sorry, I didn't catch which alarm. Say it like cancel my seven A M alarm.
                  {% else %}
                    You have no alarm at that time.
                  {% endif %}
          - stop: "Nothing matched"
            response_variable: result
      - variables:
          result:
            speech: >-
              {% set ns = namespace(parts=[]) %}
              {% for i in matches %}
                {% set s = states('input_datetime.hub_alarm_' ~ i) %}
                {% set h = s[0:2] | int %}
                {% set m = s[3:5] | int %}
                {% set ns.parts = ns.parts + [(h % 12 or 12) ~ (':%02d' | format(m) if m else '') ~ (' AM' if h < 12 else ' PM')] %}
              {% endfor %}
              Cancelled your {{ ns.parts | join(' and ') }} alarm{{ 's' if matches | length > 1 else '' }}.
      - action: input_boolean.turn_off
        target:
          entity_id: >-
            {% set ns = namespace(list=[]) %}
            {% for i in matches %}
              {% set ns.list = ns.list + ['input_boolean.hub_alarm_' ~ i] %}
            {% endfor %}
            {{ ns.list }}
      - stop: "Cancelled"
        response_variable: result

  # Voice: "cancel all alarms".
  hub_alarm_cancel_all:
    alias: "Hub alarm: cancel all by voice"
    mode: queued
    sequence:
      - variables:
          count: >-
            {% set ns = namespace(n=0) %}
            {% for i in range(1, 6) %}
              {% if is_state('input_boolean.hub_alarm_' ~ i, 'on') %}
                {% set ns.n = ns.n + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.n }}
          was_ringing: "{{ is_state('input_boolean.hub_alarm_ringing', 'on') }}"
      - if:
          - condition: template
            value_template: "{{ was_ringing }}"
        then:
          - action: script.hub_alarm_stop
            data:
              reason: user
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hub_alarm_1
            - input_boolean.hub_alarm_2
            - input_boolean.hub_alarm_3
            - input_boolean.hub_alarm_4
            - input_boolean.hub_alarm_5
      - variables:
          result:
            speech: >-
              {% if count | int == 0 %}
                {{ "Alarm stopped." if was_ringing else "You have no alarms set." }}
              {% elif count | int == 1 %}
                Cancelled your alarm.
              {% else %}
                Cancelled all {{ count }} alarms.
              {% endif %}
      - stop: "Cancelled all"
        response_variable: result

  # Voice: "when is my alarm". Lists the alarms, soonest first.
  hub_alarm_query:
    alias: "Hub alarm: say the alarms"
    mode: queued
    sequence:
      - variables:
          result:
            speech: >-
              {% set clock = now().hour * 60 + now().minute %}
              {% set ns = namespace(items=[]) %}
              {% for i in range(1, 6) %}
                {% if is_state('input_boolean.hub_alarm_' ~ i, 'on') %}
                  {% set s = states('input_datetime.hub_alarm_' ~ i) %}
                  {% set h = s[0:2] | int %}
                  {% set m = s[3:5] | int %}
                  {% set wait = (h * 60 + m - clock) % 1440 %}
                  {% set label = (h % 12 or 12) ~ (':%02d' | format(m) if m else '') ~ (' AM' if h < 12 else ' PM') ~ (' tomorrow' if h * 60 + m <= clock else '') %}
                  {% set ns.items = ns.items + [{'wait': 1440 if wait == 0 else wait, 'label': label}] %}
                {% endif %}
              {% endfor %}
              {% set labels = ns.items | sort(attribute='wait') | map(attribute='label') | list %}
              {% if labels | length == 0 %}
                You have no alarms set.
              {% elif labels | length == 1 %}
                Your alarm is set for {{ labels[0] }}.
              {% else %}
                You have {{ labels | length }} alarms: {{ labels[:-1] | join(', ') }} and {{ labels[-1] }}.
              {% endif %}
      - stop: "Listed"
        response_variable: result

# ------------------------------------------------------------ automations ----

automation:
  # The clock reaches a slot's time. If the slot is on, it switches off (alarms
  # fire once) and the alarm starts. A slot that is off does nothing.
  - id: hub_alarm_fire
    alias: "Hub alarm: fire"
    mode: queued
    trigger:
      - trigger: time
        at: input_datetime.hub_alarm_1
        id: "1"
      - trigger: time
        at: input_datetime.hub_alarm_2
        id: "2"
      - trigger: time
        at: input_datetime.hub_alarm_3
        id: "3"
      - trigger: time
        at: input_datetime.hub_alarm_4
        id: "4"
      - trigger: time
        at: input_datetime.hub_alarm_5
        id: "5"
    condition:
      - condition: template
        value_template: "{{ is_state('input_boolean.hub_alarm_' ~ trigger.id, 'on') }}"
    action:
      - action: input_boolean.turn_off
        target:
          entity_id: "input_boolean.hub_alarm_{{ trigger.id }}"
      - action: script.hub_alarm_start

  # The satellite stopped ringing by itself while an alarm was going off: the
  # knob was turned, or "stop" or "Hey Jarvis" was heard. When Home Assistant
  # stops the alarm (caught, timeout, voice command) the ringing flag is already
  # off by the time the satellite goes quiet, so this does not run twice.
  - id: hub_alarm_stopped_on_satellite
    alias: "Hub alarm: stopped on the satellite"
    mode: queued
    trigger:
      - trigger: state
        entity_id: binary_sensor.satellite_hub_ringing
        from: "on"
        to: "off"
    condition:
      - condition: state
        entity_id: input_boolean.hub_alarm_ringing
        state: "on"
    action:
      - action: script.hub_alarm_stop
        data:
          reason: user

  # The robot reports it was caught. Only counts for the alarm that is ringing.
  - id: hub_alarm_caught
    alias: "Hub alarm: robot caught"
    mode: queued
    trigger:
      - trigger: mqtt
        topic: alarmbot/caught
    condition:
      - condition: state
        entity_id: input_boolean.hub_alarm_ringing
        state: "on"
      - condition: template
        value_template: >-
          {{ trigger.payload_json is defined
             and trigger.payload_json.alarm_id is defined
             and trigger.payload_json.alarm_id == states('input_text.hub_alarm_active_id') }}
    action:
      - action: script.hub_alarm_stop
        data:
          reason: caught

  # Nobody stopped it in time.
  - id: hub_alarm_timeout
    alias: "Hub alarm: timeout"
    mode: single
    trigger:
      - trigger: state
        entity_id: input_boolean.hub_alarm_ringing
        to: "on"
        for:
          minutes: "{{ states('input_number.hub_alarm_timeout_minutes') | int(10) }}"
    action:
      - action: script.hub_alarm_stop
        data:
          reason: timeout

  # Home Assistant restarted while an alarm was going off. Its timeout was lost
  # with the restart, so end the alarm cleanly instead of leaving it stuck on.
  - id: hub_alarm_clear_after_restart
    alias: "Hub alarm: clear after restart"
    mode: single
    trigger:
      - trigger: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.hub_alarm_ringing
        state: "on"
    action:
      - action: script.hub_alarm_stop
        data:
          reason: timeout

  # MQTT for the robot (draft contract in docs/MILESTONES.md). These two only
  # listen for the semantic events, so anything that starts or stops an alarm
  # through the scripts is published without knowing about MQTT.
  - id: hub_alarm_publish_start
    alias: "Hub alarm: publish start"
    mode: queued
    trigger:
      - trigger: event
        event_type: hub_alarm_started
    action:
      - action: mqtt.publish
        data:
          topic: hub/alarm/start
          qos: 1
          retain: false
          payload: >-
            {{ {'alarm_id': trigger.event.data.alarm_id,
                'ts': utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')} | to_json }}

  - id: hub_alarm_publish_stop
    alias: "Hub alarm: publish stop"
    mode: queued
    trigger:
      - trigger: event
        event_type: hub_alarm_stopped
    action:
      - action: mqtt.publish
        data:
          topic: hub/alarm/stop
          qos: 1
          retain: false
          payload: >-
            {{ {'alarm_id': trigger.event.data.alarm_id,
                'reason': trigger.event.data.reason,
                'ts': utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')} | to_json }}

# ---------------------------------------------------------- voice commands ----
# The phrases are in custom_sentences/en/hub_alarms.yaml. Each intent runs a
# script above and speaks the sentence the script hands back. "when" is the time
# exactly as it was said; hub_alarm_parse_time makes sense of it.
#
# The words are passed on with "said:" in front. Without it, Home Assistant
# would turn words that look like a number into one before the script sees
# them, and "7.30" would arrive as 7.3. The scripts strip the prefix.

intent_script:
  HubSetAlarm:
    action:
      - action: script.hub_alarm_set
        data:
          when: "said:{{ when | default('') }}"
        response_variable: result
      - stop: ""
        response_variable: result
    speech:
      text: "{{ action_response.speech }}"

  HubCancelAlarm:
