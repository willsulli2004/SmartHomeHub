      - action: script.hub_alarm_cancel
        data:
          when: "said:{{ when | default('') }}"
        response_variable: result
      - stop: ""
        response_variable: result
    speech:
      text: "{{ action_response.speech }}"

  HubCancelAllAlarms:
    action:
      - action: script.hub_alarm_cancel_all
        response_variable: result
